<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debug Layout Apostila</title>
<style>body{font-family:system-ui,Arial,sans-serif;margin:20px;line-height:1.4} .ok{color:#0a6}.bad{color:#b00} pre{background:#f4f4f4;padding:12px;overflow:auto} .box{border:2px solid #0a2238;padding:12px;margin:12px 0}</style>
</head><body>
<h1>Debug de layout</h1>
<p>Abra este arquivo maximizado e também <a href="index.html">index.html</a> e <a href="partes/01-resistencia.html">partes/01-resistencia.html</a>. Envie: navegador/versão, zoom, resolução, e o bloco abaixo.</p>
<div class="box"><strong>Viewport:</strong> <span id="vp"></span></div>
<div class="box"><strong>Chapter body (após carregar parte):</strong> <span id="cb">abra uma página de capítulo e rode o teste abaixo</span></div>
<button id="test">Testar página do capítulo em iframe</button>
<pre id="out"></pre>
<iframe id="f" src="partes/01-resistencia.html" style="width:100%;height:60vh;border:1px solid #999;margin-top:12px"></iframe>
<script>
function info(){
  document.getElementById('vp').textContent = innerWidth+'x'+innerHeight+' dpr='+devicePixelRatio+' zoom?='+Math.round((outerWidth/innerWidth)*100)+'%';
}
info(); addEventListener('resize',info);
document.getElementById('test').onclick=function(){
  try{
    const d=document.getElementById('f').contentDocument;
    const cb=d.querySelector('.chapter-body, article, .content, main');
    const cs=cb?getComputedStyle(cb):null;
    const m=d.querySelector('main');
    const ms=m?getComputedStyle(m):null;
    const o={url:d.location.href, found:!!cb, selector:cb?(cb.className||cb.tagName):null,
      display:cs?.display, visibility:cs?.visibility, opacity:cs?.opacity,
      width:cb?.getBoundingClientRect().width, height:cb?.getBoundingClientRect().height,
      mainDisplay:ms?.display, mainHeight:m?.getBoundingClientRect().height,
      mainWidth:m?.getBoundingClientRect().width, errors: 'veja Console (F12) na página do capítulo'};
    document.getElementById('out').textContent=JSON.stringify(o,null,2);
  }catch(e){ document.getElementById('out').textContent='Erro (possível restrição): '+e; }
};
</script>
</body></html>
